<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            color: yellow;

        }
        div:hover{
            color: aqua;
        }
        div:visited{
            color: brown;
        }
    </style>
</head>
<body>
    <p>伪类选择器</p>
    <div>选择器：hover（鼠标悬停状态）{css属性}</div>
    <div>超链接有四个状态：
        (按顺序写)
    </div>
    <div>：link（访问前）</div>
    <div>：visited（访问后）</div>
    <div>：hover（鼠标悬停时）</div>
    <div>：active（点击时）</div>
</body>
</html>
