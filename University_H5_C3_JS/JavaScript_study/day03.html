    //函数
    function sayHello(student){

            return
        }

    }

    const arr5 = [5,12,78,56,49]
    console.log(arr5)
    function sortArry(arr){
        for(let i=0;i<arr.length-1;i++){
            for(let j=0;j<arr.length-1-i;j++){
            if(arr[j] < arr[j+1]){
                let sum = arr[j+1]
                arr[j+1] = arr[j]
                arr[j] = sum
            }
            }
        }
        return arr
    }
    console.log(sortArry(arr5))
