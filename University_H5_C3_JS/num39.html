<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            color: rgb(2, 3, 1,0.8);
            /* 前三个表示红绿蓝三原色，取0 - 255，最后一个表示透明度，取0 - 1或者不要最后一个值 */
            /* 英文法直接写英文单词 */
        }
        div{
            color: #000;
            /* 十六进制写法 */
        }
    </style>
</head>
<body>
    <p>文字颜色的四种写法</p>
    <div>英文法，rgb表示法，rgba表示法，十六进制表示法</div>
</body>
</html>
