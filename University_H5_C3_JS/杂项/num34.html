<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .p1{
            font-size: 30px;
        }
        .p3{
            /* 700为加粗，400为不加粗 */
            font-weight: 700;
            /* 或者正常为normal，加粗为bold */

        }
        h3{
            /* 标题默认加粗 */
            font-weight: 400;
        }
        .p4{
            /* italic为文字倾斜效果，normal为正常效果 */
            font-style: italic;
        }
        em{
            font-style: normal;
        }
    </style>
</head>
<body>
    <p class="p1">文字大小测试</p>
    <p>默认文字大小为16px</p>
    
    <h3>标题</h3>
    <p class="p3">文字粗细</p>

    <P class="p4"> 文字倾斜效果</P>
    <em>em标签默认倾斜</em>





</body>
</html>
