<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 表格是有结构的，不能跨结构合并 -->
    <table border="1">
        <!-- border作为显示表格线用 -->
        <thead>
            <tr>
                <!-- th有加粗效果，居中效果，用作表头 -->
                <th>姓名</th>
                <th>语文</th>
                <th>数学</th>
                <th>英语</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>张三</td>
                <td>99</td>
                <td rowspan="2">98</td>
                <td>99</td>
            </tr>
            <tr>
                <td>李四</td>
                <td>99</td>
                <!-- <td>98</td> -->
                <td>98</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td>王五</td>
                <td colspan="3">99</td>
                <!-- <td>99</td> -->
                <!-- <td>99</td> -->
            </tr>
        </tfoot>
        <!-- <table></table>和<tbody></tbody>和<tfoot></tfoot>是表格结构标签，浏览器内没有效果，只是为了让浏览器更好的清晰表格的结构内容 -->
    </table>






























</body>
</html>
