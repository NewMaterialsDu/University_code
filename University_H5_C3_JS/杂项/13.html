<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 音频标签 -->
    <!--在html5中，如果属性名和属性值完全一样，可以写为一个单词 -->
    <!-- controls作用为添加音频控制面板 loop为循环播放 autoplay为自动播放（为了用户体验，浏览器一般会禁止自动播放） -->
    <audio src="./1760750616_9_0(1).wav" controls loop autoplay></audio>

    <!-- 视频标签 -->
    <!-- 和音频一样的属性 -->
     <!-- muted为静音播放 -->
    <!-- 为用户体验，自动播放需在静音状态才支持 -->
    <video src="./f18b121c29c99030d6ec239eaa660ddf.mp4" controls loop autoplay muted></video>






















    
</body>
</html>
