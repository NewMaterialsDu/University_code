<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        span{
            color: red;
        }
        /* *{
            color: aqua !important;
        } */
        p{
            color: black;
        }
        .c1 .c2 div{
            color: blue;
        }
        div #box3{
            color: aqua;
        }
        #box1 .c3{
            color: brown;
        }

    </style>
</head>

<body>
    <span>css特性：
        <p>继承性：子级默认继承父级的文字属性（当标签有自己的样式时就失效）</p>
        <p>层叠性(选择器相同时)：相同的属性，后面的会覆盖前面的属性</p>
        <p>优先级（两个选择器不同时）：通配符&lt;标签选择器&lt;类选择器&lt;id选择器&lt;行内样式&lt;!important（选中标签范围越大，优先级越低）!important把权重提到最高</p>
        <p>叠加计算（如果一个标签被多个选择器选中）：（行内样式，id选择器，类选择器，标签选择器）从左向右依次比较个数，同一级个数多的优先级高，个数相同则向后比较（！important权重最高，继承权权重最低）</p>
        <p></p>
        <p></p>
    </span>

    <div id="box1" class="c1">
        <div id="box2" class="c2">
            <div id="box3" class="c3">
                这行文字是什么颜色？
            </div>  
        </div>
    </div>





</body>

</html>
