<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>文本缩进</p>
    <div>
        <img src="./10图像.jpg" alt="">
    </div>
    
</body>
<style>
    p{
      /* 2em表示当前文字大小的两个位置，也可以直接写数字+px */
      text-indent: 2em;
      /* 文本水平对齐，左为left，右为right，居中为center */
        text-align: center;
        /* 本质是文字居中，不影响标签 */
        /* 图片居中就给图片的父级标签设置 */
        text-decoration: underline;
        /* 给文字加修饰线，none无，underline下划线，line-through删除线，overline上划线 */
    }
    div{
        text-align: center;
    }
</style>
</html>
