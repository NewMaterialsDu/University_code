<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <!-- <img src="图像的url"> -->
src用于指定图像的位置和名称，是<img>的必须属性
    <img src="./10图像.jpg">
    <img src="./10图像.jpg" alt="图片加载失败">
    <!-- 图片没有显示出来时显示的文字 -->
    <img src="./10图像.jpg" title="一只美女">
    <!-- 把鼠标放在图片上显示的文字 -->
    <img src="./10图像.jpg" width="100" height="600">
<!-- width是图片的宽，height是图片的高，浏览器是等比缩放的，宽和高也可以分开用 -->




    
</body>
</html>
