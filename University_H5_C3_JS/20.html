<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- br换行 -->
    文本框：<input type="text" placeholder="提示词:">
    <!-- 单行不换,placeholder占位符，用在文本框和密码框 -->
    <br><br>
    密码框：<input type="password">
    <!-- 显示点点 -->
    <br><br>
    单选框：<input type="radio">
    <br><br>
    <!-- 默认选中加checked -->
    多选框：<input type="checkbox" checked>嘿嘿<input type="checkbox" >嘿嘿<input type="checkbox" >嘿嘿
    <br><br>
    上传文件：<input type="file" multiple>
    <!-- 加一个multiple属性（本来只能上传一个） -->
    <br><br>
    <!-- 单选框：名字一样为一组，只能选一个，默认选中一个就加checked -->
    <input type="radio" name="gender"> 男
    <input type="radio" name="gender" checked> 女
















    
</body>
</html>
